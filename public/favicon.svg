  <circle cx="32" cy="32" r="17" fill="none" stroke="#d8b4fe" stroke-width="1" stroke-opacity="0.35" />
  <circle cx="32" cy="32" r="12" fill="none" stroke="#d8b4fe" stroke-width="1" stroke-opacity="0.4" />

